name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 i686
        run: |
          for attempt in 1 2 3; do
            echo "apt attempt $attempt"
            sudo apt-get update -o Acquire::Retries=5
            if sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686; then
              break
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep 15
          done

      - name: Build DLL
        run: sh build.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Decky plugin frontend
        working-directory: decky/fnv-speed
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package Decky plugin zip
        run: sh pack-decky.sh

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: windows-dlls
          path: |
            FNVSpeedhack.dll
            dist/dinput8.dll

      - name: Upload Decky plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: fnv-speed-decky-plugin
          path: release/fnv-speed.zip
